<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz EBO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { font-family: Inter, "Segoe UI", Arial, sans-serif; color: #172033; background: #eef7ff; font-synthesis: none; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; padding: 24px 14px; background: radial-gradient(ellipse at 12% 0%, rgba(147,213,255,.42), transparent 38%), linear-gradient(135deg, #f8fcff, #eaf5ff 58%, #f5fbff); }
        button { font: inherit; cursor: pointer; }
        button:disabled { cursor: not-allowed; }
        .page { width: min(760px, 100%); margin: 0 auto; }
        .header, .card { border: 1px solid #dceaf5; border-radius: 18px; background: rgba(255,255,255,.98); box-shadow: 0 12px 30px rgba(43,94,132,.09); }
        .header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; padding: 22px; color: #102a43; background: linear-gradient(115deg, rgba(255,255,255,.99), rgba(235,247,255,.98)); border-color: #cfe7f8; }
        .logo-wrap { display: grid; width: 76px; height: 76px; flex: 0 0 76px; place-items: center; padding: 4px; border-radius: 50%; background: linear-gradient(135deg, #06b6d4, #2563eb, #4338ca); }
        .logo { width: 100%; height: 100%; border-radius: 50%; object-fit: contain; background: #020617; }
        .header-copy { display: flex; align-items: center; gap: 16px; min-width: 0; }
        .header-text { min-width: 0; }
        .eyebrow { margin: 0 0 5px; color: #0876b9; font-size: .75rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
        h1 { margin: 0; font-size: clamp(1.3rem, 4vw, 1.8rem); }
        .reference { margin: 8px 0 0; color: #526b80; }
        .restart-button { flex: 0 0 auto; padding: 10px 15px; border: 1px solid #b8dcee; border-radius: 10px; color: #0876b9; background: #f0f9ff; font-weight: 750; }
        .restart-button:hover { border-color: #69bde8; background: #e0f2fe; }
        .dashboard { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 0 0 16px; }
        .stat-card { min-width: 0; padding: 15px 14px; border: 1px solid #dceaf5; border-left: 4px solid #18b9ce; border-radius: 14px; background: rgba(255,255,255,.98); box-shadow: 0 8px 20px rgba(43,94,132,.07); text-align: center; }
        .stat-card.correct-stat { border-left-color: #10b981; }
        .stat-card.wrong-stat { border-left-color: #f43f5e; }
        .stat-card.score-stat { border-left-color: #3b82f6; }
        .stat-label { color: #64748b; font-size: .76rem; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
        .stat-value { margin-top: 6px; color: #172033; font-size: clamp(1.2rem, 3vw, 1.65rem); font-weight: 850; }
        .correct-stat .stat-value { color: #059669; }
        .wrong-stat .stat-value { color: #e11d48; }
        .score-stat .stat-value { color: #2563eb; white-space: nowrap; font-size: clamp(1rem, 2.8vw, 1.65rem); }
        .stat-caption { margin-top: 4px; color: #94a3b8; font-size: .72rem; }
        .progress-track { height: 6px; margin-top: 9px; overflow: hidden; border-radius: 999px; background: #e2e8f0; }
        .progress-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #20b6d2, #3182e8); transition: width .3s ease; }
        .card { padding: clamp(18px, 5vw, 28px); }
        .badge { display: inline-block; margin-bottom: 16px; padding: 6px 10px; border-radius: 999px; color: #075985; background: #e0f2fe; font-size: .82rem; font-weight: 800; }
        h2 { margin: 0 0 18px; font-size: 1.15rem; line-height: 1.5; }
        .options { display: grid; gap: 10px; }
        .option { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 13px 15px; border: 2px solid #e2e8f0; border-radius: 11px; color: #172033; background: white; text-align: left; line-height: 1.45; }
        .option-copy { display: flex; align-items: center; gap: 12px; }
        .option-letter { display: grid; width: 30px; height: 30px; flex: 0 0 30px; place-items: center; border: 1px solid #cbd5e1; border-radius: 9px; color: #475569; background: #f1f5f9; font-size: .82rem; font-weight: 800; }
        .status-icon { display: grid; width: 23px; height: 23px; flex: 0 0 23px; place-items: center; border: 2px solid #dbe3ec; border-radius: 50%; color: #94a3b8; font-size: .85rem; font-weight: 900; }
        .option:hover:not(:disabled) { border-color: #4aa9e8; background: #f0f9ff; }
        .option.correct { border-color: #10b981; color: #065f46; background: #ecfdf5; }
        .option.correct .status-icon { border-color: #059669; color: white; background: #059669; }
        .option.incorrect { border-color: #fb4665; color: #9f1239; background: #fff1f2; }
        .option.incorrect .status-icon { border-color: #e11d48; color: white; background: #e11d48; }
        .feedback { margin-top: 16px; padding: 14px; border: 1px solid #cbd5e1; border-radius: 11px; background: #f8fafc; line-height: 1.55; }
        .feedback strong { display: block; margin-bottom: 4px; }
        .feedback.correct { border-color: #6ee7b7; color: #065f46; background: #ecfdf5; }
        .feedback.incorrect { border-color: #fda4af; color: #9f1239; background: #fff1f2; }
        .feedback-heading { display: flex; align-items: center; gap: 9px; }
        .feedback-icon { display: grid; width: 23px; height: 23px; flex: 0 0 23px; place-items: center; border-radius: 50%; color: white; background: #059669; font-size: .85rem; font-weight: 900; }
        .feedback.incorrect .feedback-icon { background: #e11d48; }
        .feedback-copy { display: block; }
        .navigation { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .button { padding: 11px 20px; border: 0; border-radius: 10px; color: white; background: linear-gradient(105deg, #3182e8, #20b6d2); box-shadow: 0 7px 15px rgba(2,132,199,.16); font-weight: 750; }
        .button:disabled { background: #cbd5e1; box-shadow: none; color: #64748b; }
        .results-header { margin-bottom: 22px; text-align: center; }
        .trophy { display: grid; width: 80px; height: 80px; place-items: center; margin: 0 auto 13px; border-radius: 50%; color: white; background: linear-gradient(to top right, #2563eb, #22d3ee); box-shadow: 0 8px 20px rgba(37,99,235,.25); font-size: 1.875rem; }
        .results-header h2 { margin: 0 0 8px; font-size: clamp(1.45rem, 4vw, 1.9rem); }
        .results-header p { max-width: 560px; margin: 0 auto; color: #475569; line-height: 1.55; }
        .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 18px 0; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }
        .metric { padding: 16px 12px; border: 1px solid #e2e8f0; border-radius: 12px; background: #f8fafc; text-align: center; }
        .metric-label { display: block; color: #64748b; font-size: .79rem; font-weight: 600; }
        .metric-value { margin-top: 7px; color: #2563eb; font-size: clamp(1.2rem, 4vw, 1.65rem); font-weight: 800; }
        .metric-value.score-value { white-space: nowrap; font-size: clamp(.85rem, 2.2vw, 1.4rem); }
        .metric-value.accuracy { color: #059669; }
        .metric-value.evaluation { color: #172033; font-size: .92rem; line-height: 1.45; }
        .report-heading { display: flex; align-items: center; gap: 9px; margin: 22px 0 12px; font-size: 1.05rem; }
        .review { display: grid; gap: 12px; margin-top: 20px; }
        .report-heading + .review { margin-top: 0; }
        .review-item { padding: 14px; border: 1px solid #e2e8f0; border-radius: 11px; line-height: 1.5; }
        .review-item.correct-answer { border-color: #6ee7b7; background: #ecfdf5; }
        .review-item.incorrect-answer { border-color: #fda4af; background: #fff1f2; }
        .review-item p { margin: 5px 0 0; color: #475569; }
        .review-result { font-weight: 750; }
        .review-result.correct { color: #047857; }
        .review-result.incorrect { color: #be123c; }
        .review-correct-option { color: #047857 !important; font-weight: 700; }
        .celebration-layer { position: fixed; inset: 0; z-index: 20; overflow: hidden; pointer-events: none; }
        .confetti-piece { position: absolute; top: -16px; left: var(--left); width: var(--size); height: calc(var(--size) * 1.55); border-radius: 2px; background: var(--color); opacity: 0; animation: confetti-fall var(--duration) linear var(--delay) forwards; }
        .confetti-piece.reduced-motion { top: var(--top); opacity: .9; animation: none; transform: rotate(var(--rotation)); }
        .confetti-piece:nth-child(3n) { border-radius: 50%; }
        @keyframes confetti-fall {
            0% { opacity: 0; transform: translate3d(0, -4vh, 0) rotate(0); }
            10% { opacity: 1; }
            100% { opacity: 0; transform: translate3d(var(--drift), 110vh, 0) rotate(720deg); }
        }
        .hidden { display: none; }
        @media (max-width: 600px) { .metrics { grid-template-columns: 1fr; } .dashboard { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 500px) { body { padding: 14px 10px; } .header { align-items: flex-start; padding: 16px; } .header-copy { align-items: flex-start; gap: 10px; } .logo-wrap { width: 52px; height: 52px; flex-basis: 52px; } .restart-button { padding: 9px 10px; font-size: .8rem; } .stat-card { padding: 12px 8px; } .navigation .button { flex: 1; } .option { padding: 11px; } }
        @media (prefers-reduced-motion: reduce) { .progress-fill { transition: none; } }
    </style>
</head>
<body>
    <main class="page">
        <header class="header">
            <div class="logo-wrap"><img class="logo" src="ebo.png" alt="Logo da Escola Bíblica Online"></div>
            <div class="header-copy">
                <div class="header-text">
                    <p class="eyebrow">Escola Bíblica Online</p>
                    <h1 id="quiz-title"></h1>
                    <p class="reference" id="quiz-reference"></p>
                </div>
            </div>
            <button class="restart-button" id="restart-header" type="button">↻ Reiniciar</button>
        </header>
        <div class="dashboard" id="dashboard">
            <div class="stat-card">
                <div class="stat-label">Progresso</div>
                <div class="stat-value" id="stat-progress">0 / 10</div>
                <div class="progress-track"><div class="progress-fill" id="stat-progress-bar"></div></div>
            </div>
            <div class="stat-card correct-stat">
                <div class="stat-label">Acertos</div>
                <div class="stat-value" id="stat-correct">0</div>
                <div class="stat-caption"><span id="stat-accuracy">0</span>% de precisão</div>
            </div>
            <div class="stat-card wrong-stat">
                <div class="stat-label">Erros</div>
                <div class="stat-value" id="stat-wrong">0</div>
                <div class="stat-caption">Revisão automática</div>
            </div>
            <div class="stat-card score-stat">
                <div class="stat-label">Pontuação</div>
                <div class="stat-value" id="stat-score">0 pts</div>
                <div class="stat-caption">100 pts por acerto</div>
            </div>
        </div>
        <section class="card" id="question-card">
            <div class="badge" id="badge"></div>
            <h2 id="question"></h2>
            <div class="options" id="options"></div>
            <div class="feedback hidden" id="feedback" aria-live="polite"></div>
            <div class="navigation">
                <button class="button" id="next" type="button" disabled>Próxima pergunta</button>
            </div>
        </section>
        <section class="card hidden" id="results" aria-live="polite"></section>
    </main>
    <script type="application/json" id="quiz-data">{"lesson":"Lição 5","theme":"O Mistério Revelado E Uma  Oração Fervorosa","reference":"Efésios 3:1-21","questions":[{"question":"No início do capítulo 3, como o apóstolo Paulo se identifica a respeito de sua situação?","options":["Apóstolo dos judeus","Prisioneiro de Cristo Jesus por causa dos gentios","Profeta de Jerusalém","Mestre da lei em Roma"],"correct":1,"explanation":"Paulo inicia o capítulo dizendo: \"Por essa razão, eu, Paulo, prisioneiro de Cristo Jesus por amor de vós, gentios...\" (Efésios 3:1)."},{"question":"O que Paulo diz que lhe foi dispensado por Deus em favor dos ouvintes?","options":["A graça e o apostolado aos judeus","A sabedoria para julgar as nações","A graça da dispensação do ministério (mistério)","O poder de fazer milagres materiais"],"correct":2,"explanation":"Paulo explica que Deus lhe deu a responsabilidade (dispensação) de revelar um plano que antes estava oculto: a graça de Deus concedida a ele para ministrar aos gentios (Efésios 3:2)."},{"question":"Qual é o \"mistério\" que foi revelado a Paulo pelo Espírito?","options":["Que os judeus seriam destruídos e os gentios salvariam a si mesmos","Que os gentios são co-herdeiros, membros do mesmo corpo e co-participantes da promessa em Cristo Jesus","Que o mundo acabaria no primeiro século","Que a lei de Moisés deveria ser cumprida rigorosamente por todos"],"correct":1,"explanation":"Em Efésios 3:6, o texto esclarece o mistério: \"A saber, que os gentios são co-herdeiros, membros do mesmo corpo e co-participantes da promessa em Cristo Jesus por meio do evangelho\"."},{"question":"De que forma Paulo se descreve quanto ao seu próprio mérito em relação a todos os santos?","options":["O mais instruído dos fariseus","O menor de todos os santos","O maior líder da igreja primitiva","O escolhido desde o ventre para substituir Pedro"],"correct":1,"explanation":"Com grande humildade, Paulo afirma em Efésios 3:8: \"A mim, o menor de todos os santos, foi dada esta graça de pregar aos gentios as insondáveis riquezas de Cristo\"."},{"question":"De acordo com Efésios 3:10, qual é o propósito de a multiforme sabedoria de Deus ser manifestada por meio da Igreja?","options":["Para que os reis da terra temam o poder romano","Para substituir o templo físico de Jerusalém por um império político","Para enriquecer materialmente os fiéis","Para que os principados e potestades nos lugares celestiais conheçam essa sabedoria"],"correct":3,"explanation":"Explicação: Efésios 3:10 declara: \"Para que a multiforme sabedoria de Deus se torne conhecida, agora, dos principados e potestades nos lugares celestiais, por meio da igreja\"."},{"question":"O que nós temos por intermédio da fé em Cristo, segundo Efésios 3:12?","options":["Ousadia e acesso a Deus com toda a confiança","Riquezas terrenas e livramento de todas as doenças físicas","Imunidade a qualquer tipo de perseguição ou sofrimento","O poder de controlar os elementos da natureza"],"correct":0,"explanation":"O versículo 12 afirma: \"Nele, por intermédio da fé, temos ousadia e acesso a Deus com toda a confiança\"."},{"question":"Por que Paulo pede aos irmãos, no versículo 13, que não desanimem?","options":["Porque ele seria libertado da prisão no dia seguinte","Por causa das tribulações dele em favor deles, que são a glória deles","Porque o Império Romano logo cairia","Porque eles não passariam mais por nenhuma provação"],"correct":1,"explanation":"\"Portanto, peço a vocês que não desanimem por causa das minhas tribulações em seu favor, pois elas são glória para vocês\" (Efésios 3:13)."},{"question":"O que Paulo pede ao Pai em sua oração para que Ele conceda aos crentes, segundo as Suas riquezas da glória?","options":["Que sejam coroados príncipes deste mundo","Que tenham livramento imediato de impostos e guerras","Que sejam fortalecidos com poder, mediante o Seu Espírito, no homem interior","Que nunca mais sintam tristeza ou cansaço físico"],"correct":2,"explanation":"Paulo ora para que Deus os fortaleça \"com poder, mediante o seu Espírito, no homem interior\" (Efésios 3:16)."},{"question":"Para que Cristo habite no coração dos crentes por meio da fé, onde eles devem estar arraigados e alicerçados?","options":["Na sabedoria filosófica grega","Na observância rígida de rituais externos","No amor","Na força militar e política"],"correct":2,"explanation":"Efésios 3:17 diz: \"e, assim, habite Cristo no vosso coração, pela fé, estando vós arraigados e alicerçados em amor\"."},{"question":"Como Paulo encerra a doxologia (o louvor) no final do capítulo 3 (Efésios 3:20-21)?","options":["Ordenando que fujam de Éfeso imediatamente","Pedindo uma coleta de ofertas para a Judeia","Pregando sobre a armadura de Deus","Afirmando que Deus é capaz de fazer infinitamente mais do que tudo o que pedimos ou pensamos"],"correct":3,"explanation":"O capítulo termina com o famoso louvor: \"Ora, àquele que é poderoso para fazer infinitamente mais do que tudo quanto pedimos ou pensamos, conforme o seu poder que opera em nós, a ele seja a glória, na igreja e em Cristo Jesus, por todas as gerações, para todo o sempre. Amém!\" (Efésios 3:20-21)."}]}</script>
    <script>
        "use strict";
        const quiz = JSON.parse(document.getElementById("quiz-data").textContent);
        const labels = ["A", "B", "C", "D"];
        const answers = [];
        const selectedAnswers = [];
        let current = 0;
        let locked = false;
        let celebrationTimer = null;
        const byId = (id) => document.getElementById(id);
        byId("quiz-title").textContent = quiz.lesson + ": " + quiz.theme;
        byId("quiz-reference").textContent = quiz.reference;

        function updateDashboard() {
            const answeredCount = answers.filter((answer) => answer !== undefined).length;
            const correctCount = answers.filter(Boolean).length;
            const incorrectCount = answeredCount - correctCount;
            const accuracy = answeredCount ? Math.round(correctCount / answeredCount * 100) : 0;
            byId("stat-progress").textContent = answeredCount + " / " + quiz.questions.length;
            byId("stat-progress-bar").style.width = (answeredCount / quiz.questions.length * 100) + "%";
            byId("stat-correct").textContent = String(correctCount);
            byId("stat-accuracy").textContent = String(accuracy);
            byId("stat-wrong").textContent = String(incorrectCount);
            byId("stat-score").textContent = (correctCount * 100) + " pts";
        }

        function renderQuestion() {
            const item = quiz.questions[current];
            locked = false;
            updateDashboard();
            byId("badge").textContent = "Questão " + (current + 1);
            byId("question").textContent = item.question;
            byId("feedback").className = "feedback hidden";
            byId("feedback").replaceChildren();
            byId("next").disabled = true;
            byId("next").textContent = current === quiz.questions.length - 1 ? "Ver resultado" : "Próxima pergunta";
            const options = byId("options");
            options.replaceChildren();
            item.options.forEach((text, index) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "option";
                const copy = document.createElement("span");
                copy.className = "option-copy";
                const letter = document.createElement("span");
                letter.className = "option-letter";
                letter.textContent = labels[index];
                const optionText = document.createElement("span");
                optionText.textContent = text;
                const icon = document.createElement("span");
                icon.className = "status-icon";
                icon.setAttribute("aria-hidden", "true");
                copy.append(letter, optionText);
                button.append(copy, icon);
                button.addEventListener("click", () => selectAnswer(index));
                options.append(button);
            });
        }

        function selectAnswer(selected) {
            if (locked) return;
            locked = true;
            const item = quiz.questions[current];
            const correct = selected === item.correct;
            answers[current] = correct;
            selectedAnswers[current] = selected;
            updateDashboard();
            byId("options").querySelectorAll("button").forEach((button, index) => {
                button.disabled = true;
                const icon = button.querySelector(".status-icon");
                if (index === item.correct) {
                    button.classList.add("correct");
                    icon.textContent = "✓";
                } else if (index === selected) {
                    button.classList.add("incorrect");
                    icon.textContent = "×";
                }
            });
            const feedback = byId("feedback");
            feedback.className = "feedback " + (correct ? "correct" : "incorrect");
            const feedbackHeading = document.createElement("div");
            feedbackHeading.className = "feedback-heading";
            const feedbackIcon = document.createElement("span");
            feedbackIcon.className = "feedback-icon";
            feedbackIcon.setAttribute("aria-hidden", "true");
            feedbackIcon.textContent = correct ? "✓" : "!";
            const heading = document.createElement("strong");
            heading.textContent = correct ? "Resposta correta!" : "Resposta incorreta.";
            const explanation = document.createElement("span");
            explanation.className = "feedback-copy";
            explanation.textContent = "Explicação: " + item.explanation;
            feedbackHeading.append(feedbackIcon, heading);
            feedback.append(feedbackHeading, explanation);
            feedback.classList.remove("hidden");
            byId("next").disabled = false;
        }

        function showResults() {
            byId("question-card").classList.add("hidden");
            const results = byId("results");
            results.classList.remove("hidden");
            results.replaceChildren();

            const correctCount = answers.filter(Boolean).length;
            const accuracy = Math.round(correctCount / quiz.questions.length * 100);
            const score = correctCount * 100;
            if (accuracy >= 70) celebrate();
            let evaluation;
            if (accuracy >= 90) evaluation = "🏆 Desempenho excepcional! Você demonstrou ótimo domínio da lição.";
            else if (accuracy >= 70) evaluation = "👏 Muito bom! Continue aprofundando seu conhecimento.";
            else if (accuracy >= 50) evaluation = "📖 Bom trabalho. Uma revisão da lição pode ajudar a fixar o conteúdo.";
            else evaluation = "💪 Não desanime! Revise a lição e tente novamente.";

            const header = document.createElement("div");
            header.className = "results-header";
            const trophy = document.createElement("div");
            trophy.className = "trophy";
            trophy.setAttribute("aria-hidden", "true");
            const trophyIcon = document.createElement("i");
            trophyIcon.className = "fa-solid fa-trophy";
            trophy.append(trophyIcon);
            const heading = document.createElement("h2");
            heading.textContent = "Desempenho Concluído!";
            const summary = document.createElement("p");
            summary.textContent = "Você concluiu o quiz de " + quiz.lesson + ": " + quiz.theme + ". Confira abaixo o resumo completo dos seus estudos.";
            header.append(trophy, heading, summary);

            const metrics = document.createElement("div");
            metrics.className = "metrics";
            const scoreMetric = createMetric("Pontuação Total", score + " / " + (quiz.questions.length * 100) + " pts", false, false, true);
            const accuracyMetric = createMetric("Taxa de Acertos", accuracy + "%", true);
            const evaluationMetric = createMetric("Avaliação da Lição", evaluation, false, true);
            metrics.append(scoreMetric, accuracyMetric, evaluationMetric);

            const reportHeading = document.createElement("h3");
            reportHeading.className = "report-heading";
            reportHeading.textContent = "✓ Relatório de Respostas";
            const review = document.createElement("div");
            review.className = "review";
            quiz.questions.forEach((item, index) => {
                const entry = document.createElement("article");
                entry.className = "review-item " + (answers[index] ? "correct-answer" : "incorrect-answer");
                const prompt = document.createElement("strong");
                prompt.textContent = (index + 1) + ". " + item.question;
                const result = document.createElement("p");
                result.className = "review-result " + (answers[index] ? "correct" : "incorrect");
                result.textContent = (answers[index] ? "Sua resposta: " : "Sua resposta (incorreta): ") + labels[selectedAnswers[index]] + ". " + item.options[selectedAnswers[index]];
                const correctAnswer = document.createElement("p");
                correctAnswer.className = "review-correct-option";
                correctAnswer.textContent = "Alternativa correta: " + labels[item.correct] + ". " + item.options[item.correct];
                const explanation = document.createElement("p");
                explanation.textContent = "Explicação: " + item.explanation;
                entry.append(prompt, result, correctAnswer, explanation);
                review.append(entry);
            });

            const restart = document.createElement("button");
            restart.type = "button";
            restart.className = "button";
            restart.textContent = "↻ Refazer o quiz";
            restart.addEventListener("click", () => {
                restartQuiz();
            });
            const restartWrapper = document.createElement("div");
            restartWrapper.className = "navigation";
            restartWrapper.style.justifyContent = "center";
            restartWrapper.style.marginTop = "22px";
            restartWrapper.append(restart);
            results.append(header, metrics, reportHeading, review, restartWrapper);
        }

        function celebrate() {
            clearTimeout(celebrationTimer);
            const previousCelebration = document.querySelector(".celebration-layer");
            if (previousCelebration) previousCelebration.remove();

            const layer = document.createElement("div");
            layer.className = "celebration-layer";
            layer.setAttribute("aria-hidden", "true");
            const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            const colors = ["#2563eb", "#06b6d4", "#10b981", "#f59e0b", "#ec4899", "#8b5cf6"];
            for (let index = 0; index < 56; index += 1) {
                const piece = document.createElement("span");
                piece.className = "confetti-piece";
                if (prefersReducedMotion) {
                    piece.classList.add("reduced-motion");
                    piece.style.setProperty("--top", Math.random() * 88 + "%");
                    piece.style.setProperty("--rotation", Math.random() * 360 + "deg");
                }
                piece.style.setProperty("--left", Math.random() * 100 + "%");
                piece.style.setProperty("--size", (6 + Math.random() * 6) + "px");
                piece.style.setProperty("--color", colors[index % colors.length]);
                piece.style.setProperty("--duration", (3.2 + Math.random() * 1.8) + "s");
                piece.style.setProperty("--delay", (Math.random() * .8) + "s");
                piece.style.setProperty("--drift", (Math.random() * 180 - 90) + "px");
                layer.append(piece);
            }
            document.body.append(layer);
            celebrationTimer = setTimeout(() => layer.remove(), 10000);
        }

        function createMetric(label, value, isAccuracy, isEvaluation, isScore) {
            const metric = document.createElement("div");
            metric.className = "metric";
            const title = document.createElement("span");
            title.className = "metric-label";
            title.textContent = label;
            const content = document.createElement("div");
            content.className = "metric-value" + (isAccuracy ? " accuracy" : "") + (isEvaluation ? " evaluation" : "") + (isScore ? " score-value" : "");
            content.textContent = value;
            metric.append(title, content);
            return metric;
        }

        function restartQuiz() {
            clearTimeout(celebrationTimer);
            document.querySelectorAll(".celebration-layer").forEach((layer) => layer.remove());
            answers.length = 0;
            selectedAnswers.length = 0;
            current = 0;
            locked = false;
            byId("results").classList.add("hidden");
            byId("question-card").classList.remove("hidden");
            renderQuestion();
        }

        byId("next").addEventListener("click", () => {
            if (!locked) return;
            if (current === quiz.questions.length - 1) showResults();
            else {
                current += 1;
                renderQuestion();
            }
        });
        byId("restart-header").addEventListener("click", restartQuiz);
        renderQuestion();
    </script>
</body>
</html>
